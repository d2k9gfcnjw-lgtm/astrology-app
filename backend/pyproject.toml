[project]
name = "astrology-backend"
version = "0.1.0"
description = "Local astrology workstation engine (Swiss Ephemeris + FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyswisseph>=2.10.3.2",
    "numpy>=2.0",
    "timezonefinder>=6.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
