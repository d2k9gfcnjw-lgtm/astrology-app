angular_bonuses:             # within angular_orb_degrees, full inside bonus_full_orb_degrees, half at the edge
  jupiter: {mc: 30, asc: 20, dsc: 15, ic: 15, text: "Jupiter conjunct the Midheaven is the best possible influence (p. 177)", status: core (MC), confirm (others)}
  venus:   {mc: 20, asc: 15, dsc: 15, ic: 10, text: "Venus on an angle protects the area (pp. 169-171; SRG 6)", status: confirm}
  sun:     {mc: 15, text: "the Sun on the SR MC, the safer choice to the natal tenth (SRG 6)", status: confirm}

overrides:
  - id: saturn_dominates_angle
    description: >
      "Saturn always wins over Jupiter, Venus, the Sun" (SRG 24): Saturn within the angular orb of an angle,
      even from the neighbouring house, cancels every benefic bonus on that angle.
    orb_degrees: 12
    angles: [mc, asc, dsc, ic]
    status: core (MC, book uses 5 deg), confirm (other angles, 12 deg)
  - id: heavy_transit_cancels_natal_10th
    description: >
      TR 14: the SR Ascendant in the natal 10th with a dissonant transit of Saturn, Uranus, Neptune or Pluto to the
      natal MC, 10th house, Ascendant, Sun or Moon that year means trouble: the +30 is cancelled.
    status: core
  - id: saturn_transit_2_8_penalises_jupiter_2_8
    description: >
      SRG 11 and p. 175: with Saturn transiting the natal 2nd or 8th house during the year, Jupiter in SR 2nd or 8th
      means an outflow of money.
    weight: -15
    status: core (rule), confirm (weight)

goal_profiles:               # multipliers on bonus weights and extra points named per rule above
  career:     {sr_asc_natal_house.10: 1.0, angular_bonuses: 1.2, sun_sr_house.10: 1.2}
  love:       {angular_bonuses: 1.2}
  rest:       {sr_asc_natal_house.10: 0.0, angular_bonuses: 1.0}       # protection first (SRG 21)
  money:      {angular_bonuses: 1.1}
  inner_work: {sr_asc_natal_house.10: 0.0}

robustness:
  asc_min_cusp_distance_degrees: 2.5     # SRG 7 (also the hard filter above)
  birth_time_shifts_minutes: [-45, -30]  # SRG 7: recompute as if born 30 to 45 minutes earlier ...
  use_subject_uncertainty: true          # ... and with +/- the chart's own time confidence
  flip_costs_stars: 1

star_rating:
  thresholds: [-60, -20, 10, 40, 70]     # placeholders; tune after real scores (owner F18)

city_search_defaults:                    # owner 8 Nov 2026: any inhabited place reachable by a flight plus a few hours' drive
  population_floor: 15000                # every GeoNames city (the file starts at 15,000); raise it in the finder form
  airport_types: [large_airport, medium_airport]   # any airport with scheduled commercial service (SRG 13)
  airport_scheduled_service_only: true
  airport_max_km: 250                    # about three hours' driving from the airport
  exclude_countries: []
