# Aimed solar return scoring rules (Ciro Discepolo method), starter version.
# status: core    = widely documented Discepolo rule
# status: confirm = starting assumption; check against his books before trusting
# Weights are starting points. Tune them as you study and track outcomes.
# Books owned: Solar Returns; Transits and Solar Returns; Lunar Returns.

# The finder always weighs four charts. How each one changes the score is
# decided with the owner in Phase 5; until then these are display-only.
context_charts:
  natal:
    use: SR Ascendant's natal house, natal intercepted signs
    status: core
  year_transits:
    use: heavy transits (Saturn, Uranus, Neptune, Pluto, Mars stations) to
         natal points birthday to birthday; avoid SR placements that repeat
         the same pressure, favor ones that support the stressed area
    weight: 0          # display-only until confirmed
    status: confirm
  previous_sr:
    use: what the current year set up; compare houses emphasized
    weight: 0
    status: confirm
  base_sr:
    use: the chart if the native stays home; every result reports what it
         fixes or worsens versus this one
    weight: 0
    status: confirm

house_system: placidus
cusp_orb_degrees: 2.5        # Rule 1 (Thirty Rules): a planet within 2.5 deg before or after a cusp works in BOTH houses,
                             # in aimed solar and lunar returns, transits and the radix. Owner, 27 Oct 2026.
angular_orb_degrees: 12      # a planet within 12 deg of an SR angle (ASC, MC, DSC, IC) is dominant; owner, 27 Oct 2026
star_rating:
  # raw score thresholds for 1 to 5 stars (tune after testing)
  thresholds: [-60, -20, 10, 40, 70]

hard_filters:
  - id: sr_asc_in_natal_1_6_12
    description: SR Ascendant falls in natal 1st, 6th or 12th house
    houses: [1, 6, 12]
    status: core
  - id: mars_saturn_same_house
    description: >
      Mars and Saturn in the same house of a solar or lunar return, whatever the house,
      except the 3rd and the 9th. (Thirty Rules; owner, 27 Oct 2026.)
    bodies: [mars, saturn]
    allowed_houses: [3, 9]
    status: core
  - id: stellium_1_12_reads_as_asc_in_12
    description: >
      A stellium between the 1st and the 12th houses, even of positive planets such as
      Jupiter, Venus and Mercury, is read exactly as an Ascendant in the 12th house.
      (Thirty Rules; owner, 27 Oct 2026.)
    houses: [1, 12]
    min_bodies: 3
    read_as: asc_in_12
    status: core
  - id: stellium_8_reads_as_asc_in_12
    description: >
      A stellium in the 8th house, even of positive planets, is read exactly as an
      Ascendant in the 12th house. (Thirty Rules; owner, 27 Oct 2026.)
    houses: [8]
    min_bodies: 3
    read_as: asc_in_12
    status: core

penalties:
  - id: malefics_in_sr_1_6_12
    description: Sun, Moon, Mars, Saturn, Uranus, Neptune, Pluto in SR houses 1, 6 or 12
    bodies: [sun, moon, mars, saturn, uranus, neptune, pluto]
    houses: {12: -60, 1: -45, 6: -40}
    status: core (confirm planet list and weights)
  - id: stellium_in_sr_1_6_12
    description: Three or more bodies in SR house 1, 6 or 12
    min_bodies: 3
    houses: [1, 6, 12]
    weight: -60
    status: core
  - id: malefics_in_sr_7_8
    description: Mars, Saturn or outer planets in SR 7th or 8th
    bodies: [mars, saturn, uranus, neptune, pluto]
    houses: [7, 8]
    weight: -20
    status: confirm

bonuses:
  - id: sr_asc_in_natal_10
    description: SR Ascendant in natal 10th house
    weight: 30
    goals: [career]
    status: core
  - id: benefics_angular
    description: Jupiter or Venus within orb of an SR angle, strongest at MC
    bodies: [jupiter, venus]
    angle_orb_degrees: 12      # owner: dominance within 12 deg of an angle
    weights: {mc: 30, asc: 25, dsc: 20, ic: 20}
    status: core
  - id: sun_in_sr_10_11
    description: Sun in SR 10th or 11th house
    houses: [10, 11]
    weight: 25
    status: confirm
  - id: cusp_frees_intercepted_sign
    description: An SR Placidus cusp falls in a sign intercepted in the natal chart
    weight: 5
    status: core (from his intercepted sign teaching)

overrides:
  - id: saturn_dominates_mc
    description: Saturn near the SR MC cancels any benefic bonus at the MC
    saturn_mc_orb_degrees: 12  # owner: dominance within 12 deg of an angle
    status: core (Solar Returns book)

goal_profiles:
  # multipliers applied to bonus weights per goal for the year
  career:      {sr_asc_in_natal_10: 1.0, benefics_angular: 1.2, sun_in_sr_10_11: 1.2}
  love:        {benefics_angular: 1.2}
  rest:        {sr_asc_in_natal_10: 0.0}
  money:       {benefics_angular: 1.1}
  inner_work:  {sr_asc_in_natal_10: 0.0}

finder_defaults:
  population_floor: 100000
  max_airport_distance_km: 100
  airport_types: [large_airport]
  require_scheduled_service: true
  grid_step_degrees: 1.0
  refine_step_degrees: 0.25
  latitude_range: [-60, 66]
